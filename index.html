<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Yoe - Speak. Learn. Grow.</title>
    <meta name="description" content="Yoe is an AI-powered language-learning companion where you learn languages by actually communicating in realistic scenarios." />
    <meta property="og:title" content="Yoe - Speak. Learn. Grow." />
    <meta property="og:description" content="Yoe is an AI-powered language-learning companion with interactive scenario worlds, adaptive corrections, and voice conversations." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/apple-touch.PNG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#070b12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Instant Pre-Render Theme Resolution (Zero Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('yoe_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          if (theme === 'light') {
            document.documentElement.classList.add('light-mode');
            document.documentElement.classList.remove('dark', 'dark-mode');
            document.documentElement.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f8fafc');
          } else {
            document.documentElement.classList.add('dark', 'dark-mode');
            document.documentElement.classList.remove('light-mode');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#070b12');
          }
        } catch(e) {}
      })();
    </script>

    <!-- Centralized Typography System & Application Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
  </head>
  <body class="text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
